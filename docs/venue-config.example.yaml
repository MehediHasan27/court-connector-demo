# Venue configuration for your Muse court-booking connector.
# Fill this in, then run:  npm run setup
# (Values below are an example venue. Replace every field.)

venue:
  name: "Ace Pickleball Club"
  address: "123 Court Street, Austin, TX 78701"
  lat: 30.2672
  lng: -97.7431
  # IANA timezone name, e.g. America/Chicago, Europe/London, Asia/Dhaka
  timezone: "America/Chicago"

# One entry per court. surface_type is free text (hard, turf, clay, ...).
courts:
  - name: "Court 1"
    surface_type: "hard"
    indoor: false
  - name: "Court 2"
    surface_type: "hard"
    indoor: false
  - name: "Court 3"
    surface_type: "turf"
    indoor: true
  - name: "Court 4"
    surface_type: "clay"
    indoor: false

# 24-hour HH:MM, venue local time. Slots never run past close_time.
operating_hours:
  open_time: "06:00"
  close_time: "22:00"

# All prices are in cents (2500 = $25.00) for ONE slot.
pricing:
  base_price_cents: 2500
  peak_price_cents: 4000
  # A slot is peak when its start time is >= start and < end.
  peak_hours:
    start: "17:00"
    end: "21:00"
  # Added on top of base or peak price for indoor courts.
  indoor_surcharge_cents: 1000

# Length of each bookable slot. Defaults to 60 if omitted.
slot_duration_minutes: 60
